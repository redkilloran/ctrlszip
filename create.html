<title>Create account — CTRLS.zip</title>
<link rel="stylesheet" href="css/style.css" />

<div class="wrap">
  <h1>New folder, new you</h1>
  <p>No email needed. Just a handle, a password, and a picture if you want one.</p>

  <form id="create-form">
    <p><input type="text" id="handle" placeholder="handle" autocomplete="off" required /></p>
    <p><input type="password" id="password" placeholder="password" required /></p>
    <p><input type="file" id="pfp" accept="image/*" /></p>
    <button type="submit">Create account</button>
  </form>

  <p class="hint">
    Your picture will be shrunk to 100&times;100 and dithered orange, same as
    everything else here.
  </p>
</div>

<script type="module" src="js/create.js"></script>
