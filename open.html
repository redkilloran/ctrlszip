<title>Open a folder — CTRLS.zip</title>
<link rel="stylesheet" href="css/style.css" />

<div class="wrap">
  <h1>Open</h1>

  <section id="key-step">
    <p>Enter the code from your folder card.</p>
    <form id="key-form">
      <input type="text" id="folder-key" placeholder="FOLDER KEY" autocomplete="off" required />
      <button type="submit">Continue</button>
    </form>
  </section>

  <section id="auth-step" hidden>
    <p>Who is this folder for?</p>
    <form id="login-form">
      <input type="text" id="login-handle" placeholder="your handle" autocomplete="off" required />
      <input type="password" id="login-password" placeholder="password" required />
      <button type="submit">Log in &amp; claim folder</button>
    </form>
    <p><button id="new-user-btn" type="button">New User?</button></p>
    <p class="hint">
      Made your account in the other tab already?
      <button id="recheck-btn" type="button">Continue</button>
    </p>
  </section>

  <section id="customize-step" hidden>
    <p>Your folder is yours. Give it a name and (optionally) a cover photo.</p>
    <form id="customize-form">
      <p><input type="text" id="codename" placeholder="codename" autocomplete="off" /></p>
      <p><input type="file" id="cover-photo" accept="image/*" /></p>
      <button type="submit">Save</button>
    </form>
    <p id="customize-status" class="hint"></p>
  </section>

  <p id="open-status" class="hint"></p>
</div>

<script type="module" src="js/open.js"></script>
